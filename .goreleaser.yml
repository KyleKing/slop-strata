
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/slop-strata
    id: slop-strata
    # tree-sitter is CGO-only, so every target must be buildable by a native
    # toolchain. This build covers the darwin pair the macOS runner produces;
    # linux/amd64 is built on its own runner in bump_version.yml and uploaded
    # to the same release. Targets that only ever cross-compiled were dropped
    # rather than shipped broken.
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: slop-strata

archives:
  - id: slop-strata
    formats: [binary]
    name_template: "slop-strata-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - name: slop-strata
    # Pushed over SSH with a deploy key scoped to the tap repo, since GitHub
    # offers no API to mint PATs; provisioned by scripts/provision-tap-deploy-key.sh.
    repository:
      owner: kyleking
      name: homebrew-tap
      git:
        url: git@github.com:kyleking/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    homepage: https://github.com/kyleking/slop-strata
    description: "Analyze code changes for quality over time (eg presence of slop)"
    # Without the TAP_DEPLOY_KEY secret the tap push is skipped with a warning
    # and the rest of the release still publishes, so a project that has not
    # been provisioned yet needs no config change here.
    skip_upload: '{{ if isEnvSet "TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    # The binaries are unsigned; clear the quarantine bit so macOS will run them.
    hooks:
      post:
        install: |
          Dir.glob(File.join(staged_path, "slop-strata*")).each do |f|
            system_command "/usr/bin/xattr", args: ["-c", f], must_succeed: false
          end
